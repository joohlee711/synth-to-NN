<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>synth-to-nn — 내 모듈러는 어떤 신경망?</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>synth-to-nn</h1>
      <p class="tagline">당신의 모듈러 신스는 어떤 신경망 유형일까요?</p>
    </header>

    <section class="classify-form">
      <input id="url" type="url" placeholder="https://modulargrid.net/e/racks/view/...">
      <button id="go" type="button">분류하기</button>
      <div id="status" class="status"></div>
    </section>

    <section id="result" hidden>
      <div id="result-banner" class="result-banner"></div>
      <div id="featured-card"></div>
      <h2>다른 유형들과의 호환도</h2>
      <ul id="scores" class="scores"></ul>
    </section>

    <section id="all-types">
      <h2>전체 8개 유형</h2>
      <div id="cards-grid" class="cards-grid"></div>
    </section>

    <footer>
      <p>모듈러그리드 데이터 기반 · 매칭 가중치 캘리브레이션 진행 중</p>
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
